<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão de Igreja</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <div class="login-container">
        <div class="login-card card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="d-flex justify-content-center align-items-center mb-3">
                        <span class="navbar-logo"></span>
                    </div>
                    <h2 class="fw-bold">Sistema de Gestão de Igreja</h2>
                    <p class="text-muted">Faça login para acessar o sistema</p>
                </div>
                
                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="senha" placeholder="Sua senha" required>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="lembrar">
                        <label class="form-check-label" for="lembrar">Lembrar de mim</label>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                        <a href="registro.html" class="btn btn-outline-secondary">Criar uma conta</a>
                    </div>
                    
                    <div class="alert alert-info mt-3" role="alert">
                        <h6 class="alert-heading">Usuários para teste:</h6>
                        <p class="mb-0"><strong>Pastor:</strong> pastor@igreja.com / pastor123</p>
                        <p class="mb-0"><strong>Líder:</strong> lider@igreja.com / lider123</p>
                        <p class="mb-0"><strong>Membro:</strong> membro@igreja.com / membro123</p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuração Central -->
    <script src="../js/config.js"></script>
    <!-- App JS -->
    <script src="../js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se já está logado
            const usuarioLogado = localStorage.getItem('usuario');
            if (usuarioLogado) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            const loginForm = document.getElementById('login-form');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;
                
                try {
                    // Usar a função correta fazerLogin (definida em app.js)
                    await fazerLogin(email, senha);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    alert('Email ou senha incorretos. Por favor, tente novamente.');
                    console.error('Erro de login:', error);
                }
            });
        });
    </script>
</body>
</html>
