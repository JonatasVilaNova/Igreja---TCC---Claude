<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ao Vivo - Sistema de Gestão de Igreja</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
                <span class="navbar-logo"></span>
                Sistema de Gestão de Igreja
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span class="nome-usuario">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="aovivo-container">
                <div class="aovivo-header">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-6">
                            <h1 class="mb-0">Transmissão ao Vivo</h1>
                            <p class="text-muted mb-0" id="aovivo-nome-igreja">Igreja Batista de Nova Cintra</p>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <a href="https://www.youtube.com/c/IgrejaBatistadeNovaCintra/live" target="_blank" class="btn btn-danger" id="btn-abrir-youtube">
                                <i class="fab fa-youtube me-2"></i>Abrir no YouTube
                            </a>
                            <button class="btn btn-outline-primary ms-2" id="btn-verificar-aovivo">
                                <i class="fas fa-sync-alt me-2"></i>Verificar
                            </button>
                        </div>
                    </div>
                </div>
                
                <div id="aovivo-frame-container" style="display: none;">
                    <iframe id="aovivo-frame" class="aovivo-frame" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <div id="aovivo-offline" class="aovivo-offline">
                    <div class="text-center">
                        <i class="fas fa-broadcast-tower fa-4x text-muted mb-3"></i>
                        <h3>Transmissão não disponível</h3>
                        <p class="text-muted">Não há transmissão ao vivo no momento.</p>
                        <p>A próxima transmissão está programada para:</p>
                        <div class="alert alert-info d-inline-block">
                            <strong id="proxima-transmissao">Domingo, 31/05/2025 às 10:00</strong>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-primary" id="btn-verificar-offline">
                                <i class="fas fa-sync-alt me-2"></i>Verificar novamente
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuração Central -->
    <script src="../js/config.js"></script>
    <!-- App JS -->
    <script src="../js/app.js"></script>
    <!-- Sidebar Loader -->
    <script src="../js/sidebar-loader.js"></script>

    <script>
        // Configuração lida de config.js
        const cfg = window.IGREJA_CONFIG;
        const canalId = cfg.YOUTUBE_CHANNEL_ID;

        // Aplicar valores dinâmicos da config
        document.getElementById('aovivo-nome-igreja').textContent = cfg.NOME_IGREJA;
        document.getElementById('btn-abrir-youtube').href = cfg.YOUTUBE_LIVE_URL;
        document.getElementById('proxima-transmissao').textContent = cfg.PROXIMA_TRANSMISSAO;

        document.addEventListener('DOMContentLoaded', function() {
            // Verificar login
            verificarLogin();
            
            // Configurar sidebar mobile
            const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
            if (sidebarToggleBtn) {
                sidebarToggleBtn.addEventListener('click', function() {
                    document.querySelector('.sidebar').classList.toggle('show');
                });
            }
            
            // Configurar eventos
            document.getElementById('btn-verificar-aovivo').addEventListener('click', verificarTransmissaoAoVivo);
            document.getElementById('btn-verificar-offline').addEventListener('click', verificarTransmissaoAoVivo);
            
            // Verificar transmissão inicial
            verificarTransmissaoAoVivo();
            
            // Verificar a cada 5 minutos
            setInterval(verificarTransmissaoAoVivo, 5 * 60 * 1000);
        });
        
        // Função para verificar se há transmissão ao vivo
        async function verificarTransmissaoAoVivo() {
            try {
                // Em uma implementação real, aqui seria feita uma chamada à API do YouTube
                // Para esta demonstração, vamos simular uma resposta
                
                // Simular delay de rede
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Simular resposta da API (50% de chance de estar ao vivo para demonstração)
                const aoVivo = Math.random() > 0.5;
                
                if (aoVivo) {
                    // Transmissão ao vivo disponível
                    const iframe = document.getElementById('aovivo-frame');
                    iframe.src = `https://www.youtube.com/embed/live_stream?channel=${canalId}&autoplay=1`;
                    
                    document.getElementById('aovivo-frame-container').style.display = 'block';
                    document.getElementById('aovivo-offline').style.display = 'none';
                } else {
                    // Sem transmissão ao vivo
                    document.getElementById('aovivo-frame-container').style.display = 'none';
                    document.getElementById('aovivo-offline').style.display = 'flex';
                }
            } catch (error) {
                console.error('Erro ao verificar transmissão ao vivo:', error);
                document.getElementById('aovivo-frame-container').style.display = 'none';
                document.getElementById('aovivo-offline').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
