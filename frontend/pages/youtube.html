<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - Sistema de Gestão de Igreja</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
                <span class="navbar-logo"></span>
                Sistema de Gestão de Igreja
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span class="nome-usuario">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="youtube-container">
                <div class="youtube-header">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-6">
                            <h1 class="mb-0">Canal do YouTube</h1>
                            <p class="text-muted mb-0" id="yt-nome-igreja">Igreja Batista de Nova Cintra</p>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <a href="https://www.youtube.com/@ibnovacintra" target="_blank" class="btn btn-danger" id="btn-abrir-canal">
                                <i class="fab fa-youtube me-2"></i>Abrir no YouTube
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-body p-0">
                        <div id="youtube-player" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Vídeos Recentes</h5>
                    </div>
                    <div class="card-body">
                        <div id="youtube-loading" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                            <p class="mt-3">Carregando vídeos do canal...</p>
                        </div>
                        
                        <div id="youtube-videos" class="youtube-videos" style="display: none;">
                            <!-- Será preenchido via JavaScript -->
                        </div>
                        
                        <div id="youtube-erro" class="alert alert-danger" style="display: none;">
                            Ocorreu um erro ao carregar os vídeos do canal. Por favor, tente novamente.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Configuração Central -->
    <script src="../js/config.js"></script>
    <!-- App JS -->
    <script src="../js/app.js"></script>
    <script src="../js/sidebar-loader.js"></script>

    <script>
        // Configuração lida de config.js
        const cfg = window.IGREJA_CONFIG;
        const channelId = cfg.YOUTUBE_CHANNEL_ID;

        // Aplicar valores dinâmicos da config
        document.getElementById('yt-nome-igreja').textContent = cfg.NOME_IGREJA;
        document.getElementById('btn-abrir-canal').href = cfg.YOUTUBE_CHANNEL_URL;
        
        // Variáveis para o player e lista de vídeos
        let player;
        let videoAtual = '';
        let listaVideos = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar login
            verificarLogin();
            
            // Configurar sidebar mobile
            const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
            if (sidebarToggleBtn) {
                sidebarToggleBtn.addEventListener('click', function() {
                    document.querySelector('.sidebar').classList.toggle('show');
                });
            }
            
            // Carregar vídeos do canal
            carregarVideosCanal();
        });
        
        // Função para inicializar o player do YouTube
        function onYouTubeIframeAPIReady() {
            // Inicializar player vazio — será preenchido com o primeiro vídeo real
            player = new YT.Player('youtube-player', {
                height: '500',
                width: '100%',
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }
        
        // Função chamada quando o player estiver pronto
        function onPlayerReady(event) {
            // Se já temos vídeos carregados, atualizar o player
            if (listaVideos.length > 0) {
                carregarVideo(listaVideos[0].id);
            }
        }
        
        // Função para carregar vídeos do canal
        async function carregarVideosCanal() {
            // Mostrar loading
            document.getElementById('youtube-loading').style.display = 'block';
            document.getElementById('youtube-videos').style.display = 'none';
            document.getElementById('youtube-erro').style.display = 'none';
            
            try {
                // Tentar buscar vídeos reais do canal configurado
                const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    listaVideos = data.items.map(item => {
                        // Extrair ID do vídeo do link (ex: https://www.youtube.com/watch?v=dQw4w9WgXcQ)
                        let vidId = '';
                        if (item.link && item.link.includes('v=')) {
                            vidId = item.link.split('v=')[1].split('&')[0];
                        } else if (item.guid && item.guid.includes('yt:video:')) {
                            vidId = item.guid.split('yt:video:')[1];
                        }
                        
                        return {
                            id: vidId || 'dQw4w9WgXcQ',
                            titulo: item.title,
                            descricao: '',
                            thumbnail: item.thumbnail,
                            data: new Date(item.pubDate).toLocaleDateString('pt-BR')
                        };
                    });
                } else {
                    // Fallback visual informando que não foi possível carregar os vídeos do canal real
                    throw new Error('Nenhum vídeo publicado encontrado ou canal ID inválido');
                }
                
                // Preencher lista de vídeos
                const videosContainer = document.getElementById('youtube-videos');
                videosContainer.innerHTML = '';
                
                listaVideos.forEach(video => {
                    const videoCard = document.createElement('div');
                    videoCard.className = 'card youtube-video-card';
                    videoCard.dataset.videoId = video.id;
                    
                    videoCard.innerHTML = `
                        <img src="${video.thumbnail}" class="card-img-top" alt="${video.titulo}">
                        <div class="card-body">
                            <h5 class="card-title">${video.titulo}</h5>
                            <p class="card-text text-muted">${video.data}</p>
                        </div>
                    `;
                    
                    videoCard.addEventListener('click', function() {
                        carregarVideo(video.id);
                    });
                    
                    videosContainer.appendChild(videoCard);
                });
                
                // Mostrar lista de vídeos
                document.getElementById('youtube-loading').style.display = 'none';
                document.getElementById('youtube-videos').style.display = 'grid';
                
                // Carregar primeiro vídeo no player
                if (listaVideos.length > 0 && player && player.loadVideoById) {
                    carregarVideo(listaVideos[0].id);
                }
            } catch (error) {
                console.error('Erro ao carregar vídeos do canal:', error);
                document.getElementById('youtube-loading').style.display = 'none';
                document.getElementById('youtube-erro').style.display = 'block';
            }
        }
        
        // Função para carregar um vídeo específico no player
        function carregarVideo(videoId) {
            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
                videoAtual = videoId;
                
                // Destacar vídeo selecionado
                document.querySelectorAll('.youtube-video-card').forEach(card => {
                    if (card.dataset.videoId === videoId) {
                        card.classList.add('border-primary');
                    } else {
                        card.classList.remove('border-primary');
                    }
                });
            }
        }
    </script>
</body>
</html>
