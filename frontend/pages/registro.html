<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Gestão de Igreja</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="register-container">
        <div class="card shadow-lg register-card">
            <div class="card-header bg-primary text-white text-center py-3">
                <div class="d-flex justify-content-center align-items-center mb-2">
                    <span class="navbar-logo"></span>
                </div>
                <h4 class="mb-0">Registro no Sistema de Gestão de Igreja</h4>
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <p>Preencha os dados abaixo para criar sua conta.</p>
                </div>
                
                <form id="form-registro">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Digite seu email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" placeholder="Crie uma senha" required>
                        <div class="form-text">A senha deve ter pelo menos 6 caracteres.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirmar-senha" class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" id="confirmar-senha" placeholder="Confirme sua senha" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="codigo-convite" class="form-label">Código de Convite</label>
                        <input type="text" class="form-control" id="codigo-convite" placeholder="Digite o código de convite" required>
                        <div class="form-text">Você recebeu este código do administrador da sua igreja.</div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Criar Conta</button>
                        <a href="login.html" class="btn btn-outline-secondary">Já tenho uma conta</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuração Central -->
    <script src="../js/config.js"></script>
    <!-- App JS -->
    <script src="../js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se já está logado
            const usuarioLogado = localStorage.getItem('usuario');
            if (usuarioLogado) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            // Configurar evento de submit do formulário
            const formRegistro = document.getElementById('form-registro');
            formRegistro.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;
                const confirmarSenha = document.getElementById('confirmar-senha').value;
                const codigoConvite = document.getElementById('codigo-convite').value;
                
                // Validações básicas
                if (!nome || !email || !senha || !confirmarSenha || !codigoConvite) {
                    alert('Por favor, preencha todos os campos.');
                    return;
                }
                
                if (senha.length < 6) {
                    alert('A senha deve ter pelo menos 6 caracteres.');
                    return;
                }
                
                if (senha !== confirmarSenha) {
                    alert('As senhas não coincidem.');
                    return;
                }
                
                // Validar email
                if (!email.includes('@')) {
                    alert('Por favor, insira um email válido.');
                    return;
                }
                
                try {
                    // Verificar código de convite (mock)
                    // Em um sistema real, isso seria verificado no backend
                    const codigosValidos = [
                        { codigo: 'IGREJA2025', perfil: 'padrao' },
                        { codigo: 'LIDER2025', perfil: 'admin' }
                    ];
                    
                    const codigoValido = codigosValidos.find(c => c.codigo === codigoConvite);
                    
                    if (!codigoValido) {
                        alert('Código de convite inválido.');
                        return;
                    }
                    
                    // Criar usuário
                    const usuarioData = {
                        nome,
                        email,
                        senha,
                        tipoPerfil: codigoValido.perfil
                    };
                    
                    // Em um sistema real, isso seria enviado para o backend
                    // Aqui estamos simulando uma resposta
                    const novoUsuario = {
                        id: Math.floor(Math.random() * 1000) + 10, // ID aleatório
                        nome,
                        email,
                        tipoPerfil: codigoValido.perfil
                    };
                    
                    // Simular delay de rede
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Salvar usuário no localStorage (mock)
                    const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                    usuarios.push(novoUsuario);
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                    
                    // Redirecionar para login
                    alert('Conta criada com sucesso! Faça login para continuar.');
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Erro ao registrar:', error);
                    alert('Ocorreu um erro ao criar sua conta. Por favor, tente novamente.');
                }
            });
        });
    </script>
</body>
</html>
