<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalas - Sistema de Gestão de Igreja</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
                <span class="navbar-logo"></span>
                Sistema de Gestão de Igreja
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span class="nome-usuario">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Escalas</h1>
                <button class="btn btn-primary admin-only" data-bs-toggle="modal" data-bs-target="#modalEscala">
                    <i class="fas fa-plus me-2"></i>Nova Escala
                </button>
            </div>
            
            <!-- Filtros -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="pesquisar-escala" placeholder="Pesquisar escala...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" id="filtro-ministerio">
                                <option value="">Todos os Ministérios</option>
                                <!-- Será preenchido via JavaScript -->
                            </select>
                        </div>
                        <div class="col-md-4 text-md-end">
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-primary active" id="btn-todas">Todas</button>
                                <button type="button" class="btn btn-outline-primary" id="btn-minhas">Minhas Escalas</button>
                                <button type="button" class="btn btn-outline-primary" id="btn-futuras">Futuras</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Lista de Escalas -->
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Ministério</th>
                            <th>Descrição</th>
                            <th>Membros</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-escalas">
                        <!-- Será preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nova/Editar Escala -->
    <div class="modal fade" id="modalEscala" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEscalaTitulo">Nova Escala</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="form-escala">
                        <input type="hidden" id="escala-id">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="escala-ministerio" class="form-label">Ministério</label>
                                <select class="form-select" id="escala-ministerio" required>
                                    <option value="">Selecione um ministério</option>
                                    <!-- Será preenchido via JavaScript -->
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="escala-data" class="form-label">Data</label>
                                <input type="date" class="form-control" id="escala-data" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="escala-descricao" class="form-label">Descrição</label>
                            <input type="text" class="form-control" id="escala-descricao" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Membros</label>
                            <div class="card">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table mb-0">
                                            <thead>
                                                <tr>
                                                    <th style="width: 50px;"></th>
                                                    <th>Nome</th>
                                                    <th>Função</th>
                                                    <th>Instrumento</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tabela-membros-ministerio">
                                                <!-- Será preenchido via JavaScript -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="form-text">Selecione os membros que participarão desta escala.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-salvar-escala">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuração Central -->
    <script src="../js/config.js"></script>
    <!-- App JS -->
    <script src="../js/app.js"></script>
    <!-- Sidebar Loader -->
    <script src="../js/sidebar-loader.js"></script>
    
    <script>
        let escalas = [];
        let ministerios = [];
        let membrosMinisterio = [];
        let usuarios = [];
        let membrosSelecionados = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            const usuario = verificarLogin();
            
            if (!usuario) return;
            
            try {
                // Carregar dados
                escalas = await fetchAPI('escalas');
                ministerios = await fetchAPI('ministerios');
                membrosMinisterio = await fetchAPI('membros');
                try { usuarios = await fetchAPI('usuarios'); } catch(e) { console.warn('Não foi possível carregar usuarios:', e); }
                
                // Preencher select de ministérios para filtro
                const selectMinisterio = document.getElementById('filtro-ministerio');
                ministerios.forEach(ministerio => {
                    const option = document.createElement('option');
                    option.value = ministerio.id;
                    option.textContent = ministerio.nome;
                    selectMinisterio.appendChild(option);
                });
                
                // Preencher select de ministérios para o formulário
                const selectEscalaMinisterio = document.getElementById('escala-ministerio');
                ministerios.forEach(ministerio => {
                    const option = document.createElement('option');
                    option.value = ministerio.id;
                    option.textContent = ministerio.nome;
                    selectEscalaMinisterio.appendChild(option);
                });
                
                // Preencher tabela de escalas
                atualizarTabelaEscalas();
                
                // Configurar eventos
                document.getElementById('pesquisar-escala').addEventListener('input', atualizarTabelaEscalas);
                document.getElementById('filtro-ministerio').addEventListener('change', atualizarTabelaEscalas);
                
                document.getElementById('btn-todas').addEventListener('click', () => {
                    document.getElementById('btn-todas').classList.add('active');
                    document.getElementById('btn-minhas').classList.remove('active');
                    document.getElementById('btn-futuras').classList.remove('active');
                    atualizarTabelaEscalas();
                });
                
                document.getElementById('btn-minhas').addEventListener('click', () => {
                    document.getElementById('btn-todas').classList.remove('active');
                    document.getElementById('btn-minhas').classList.add('active');
                    document.getElementById('btn-futuras').classList.remove('active');
                    atualizarTabelaEscalas();
                });
                
                document.getElementById('btn-futuras').addEventListener('click', () => {
                    document.getElementById('btn-todas').classList.remove('active');
                    document.getElementById('btn-minhas').classList.remove('active');
                    document.getElementById('btn-futuras').classList.add('active');
                    atualizarTabelaEscalas();
                });
                
                document.getElementById('escala-ministerio').addEventListener('change', function() {
                    // Participantes pertencem a um ministério: a seleção anterior não vale para o novo
                    membrosSelecionados = [];
                    carregarMembrosMinisterio();
                });
                document.getElementById('btn-salvar-escala').addEventListener('click', salvarEscala);
                
                // Resetar formulário quando o modal for fechado
                const modalEscala = document.getElementById('modalEscala');
                modalEscala.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('form-escala').reset();
                    document.getElementById('escala-id').value = '';
                    document.getElementById('modalEscalaTitulo').textContent = 'Nova Escala';
                    document.getElementById('tabela-membros-ministerio').innerHTML = '';
                    membrosSelecionados = [];
                });
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
            }
        });
        
        // Função para atualizar a tabela de escalas
        function atualizarTabelaEscalas() {
            const usuario = verificarLogin();
            const tabelaEscalas = document.getElementById('tabela-escalas');
            const pesquisa = document.getElementById('pesquisar-escala').value.toLowerCase();
            const filtroMinisterio = document.getElementById('filtro-ministerio').value;
            const filtroTipo = document.querySelector('.btn-group .active').id;
            
            tabelaEscalas.innerHTML = '';
            
            let escalasFiltradas = [...escalas];
            
            // Filtrar por pesquisa
            if (pesquisa) {
                escalasFiltradas = escalasFiltradas.filter(e => 
                    e.descricao.toLowerCase().includes(pesquisa)
                );
            }
            
            // Filtrar por ministério
            if (filtroMinisterio) {
                escalasFiltradas = escalasFiltradas.filter(e => 
                    e.idMinisterio === parseInt(filtroMinisterio)
                );
            }
            
            // Filtrar por tipo
            if (filtroTipo === 'btn-minhas') {
                // Encontrar membros do usuário
                const membroIds = membrosMinisterio
                    .filter(m => m.idUsuario === usuario.id)
                    .map(m => m.id);
                
                // Filtrar escalas que contêm esses membros
                escalasFiltradas = escalasFiltradas.filter(e => 
                    e.membros && e.membros.some(membroId => membroIds.includes(membroId))
                );
            } else if (filtroTipo === 'btn-futuras') {
                // Filtrar apenas escalas futuras
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                
                escalasFiltradas = escalasFiltradas.filter(e => 
                    new Date(e.data) >= hoje
                );
            }
            
            // Ordenar por data
            escalasFiltradas.sort((a, b) => new Date(a.data) - new Date(b.data));
            
            if (escalasFiltradas.length === 0) {
                tabelaEscalas.innerHTML = '<tr><td colspan="5" class="text-center">Nenhuma escala encontrada.</td></tr>';
                return;
            }
            
            escalasFiltradas.forEach(escala => {
                const ministerio = ministerios.find(m => m.id === escala.idMinisterio);
                const row = document.createElement('tr');
                
                // Contar membros
                const numMembros = escala.membros ? escala.membros.length : 0;
                
                row.innerHTML = `
                    <td>${formatarData(escala.data)}</td>
                    <td>${ministerio ? ministerio.nome : 'N/A'}</td>
                    <td>${escala.descricao}</td>
                    <td>${numMembros} membro(s)</td>
                    <td>
                        <div class="btn-group" role="group">
                            <a href="escala-detalhes.html?id=${escala.id}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-eye me-1"></i> Detalhes
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-success admin-only editar-escala" data-id="${escala.id}">
                                <i class="fas fa-edit me-1"></i> Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger admin-only excluir-escala" data-id="${escala.id}">
                                <i class="fas fa-trash me-1"></i> Excluir
                            </button>
                        </div>
                    </td>
                `;
                
                tabelaEscalas.appendChild(row);
            });
            
            // Configurar eventos dos botões
            document.querySelectorAll('.editar-escala').forEach(btn => {
                btn.addEventListener('click', () => abrirModalEditarEscala(btn.dataset.id));
            });
            
            document.querySelectorAll('.excluir-escala').forEach(btn => {
                btn.addEventListener('click', () => excluirEscala(btn.dataset.id));
            });
            
            // Atualizar visibilidade admin-only nos elementos recém-criados
            atualizarVisibilidadePerfil();
        }
        
        // Função para carregar membros do ministério selecionado
        async function carregarMembrosMinisterio() {
            const ministerioId = document.getElementById('escala-ministerio').value;
            const tabelaMembros = document.getElementById('tabela-membros-ministerio');
            
            tabelaMembros.innerHTML = '';
            
            if (!ministerioId) return;
            
            try {
                // Carregar membros do ministério
                const membros = await fetchAPI(`membros/ministerio/${ministerioId}`);
                
                if (membros.length === 0) {
                    tabelaMembros.innerHTML = '<tr><td colspan="4" class="text-center">Nenhum membro cadastrado neste ministério.</td></tr>';
                    return;
                }
                
                membros.forEach(membro => {
                    const usuario = usuarios.find(u => u.id === membro.idUsuario);
                    const row = document.createElement('tr');
                    
                    // Verificar se o membro já está selecionado
                    const checked = membrosSelecionados.includes(membro.id) ? 'checked' : '';
                    
                    row.innerHTML = `
                        <td>
                            <div class="form-check">
                                <input class="form-check-input membro-checkbox" type="checkbox" value="${membro.id}" ${checked}>
                            </div>
                        </td>
                        <td>${usuario ? usuario.nome : 'Usuário não encontrado'}</td>
                        <td>${membro.funcao}</td>
                        <td>${membro.instrumento || 'Não definido'}</td>
                    `;
                    
                    tabelaMembros.appendChild(row);
                });
                
                // Configurar eventos dos checkboxes
                document.querySelectorAll('.membro-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const membroId = parseInt(this.value);
                        
                        if (this.checked) {
                            if (!membrosSelecionados.includes(membroId)) {
                                membrosSelecionados.push(membroId);
                            }
                        } else {
                            membrosSelecionados = membrosSelecionados.filter(id => id !== membroId);
                        }
                    });
                });
            } catch (error) {
                console.error('Erro ao carregar membros:', error);
                tabelaMembros.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro ao carregar membros. Por favor, tente novamente.</td></tr>';
            }
        }
        
        // Função para abrir o modal de edição de escala
        async function abrirModalEditarEscala(id) {
            const escala = escalas.find(e => String(e.id) === String(id));
            
            if (!escala) return;
            
            document.getElementById('escala-id').value = escala.id;
            document.getElementById('escala-ministerio').value = escala.idMinisterio;
            document.getElementById('escala-data').value = escala.data;
            document.getElementById('escala-descricao').value = escala.descricao;
            
            document.getElementById('modalEscalaTitulo').textContent = 'Editar Escala';
            
            // Salvar membros selecionados
            membrosSelecionados = escala.membros ? [...escala.membros] : [];
            
            // Carregar membros do ministério
            await carregarMembrosMinisterio();
            
            const modal = new bootstrap.Modal(document.getElementById('modalEscala'));
            modal.show();
        }
        
        // Função para salvar escala (nova ou edição)
        async function salvarEscala() {
            const id = document.getElementById('escala-id').value;
            const idMinisterio = document.getElementById('escala-ministerio').value;
            const data = document.getElementById('escala-data').value;
            const descricao = document.getElementById('escala-descricao').value;
            
            if (!idMinisterio || !data || !descricao) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            try {
                const escalaData = {
                    idMinisterio: parseInt(idMinisterio),
                    data,
                    descricao,
                    membros: membrosSelecionados
                };
                
                let response;
                
                if (id) {
                    // Editar escala existente
                    escalaData.id = parseInt(id);
                    response = await fetchAPI(`escalas/${id}`, 'PUT', escalaData);
                    
                    // Atualizar na lista local
                    const index = escalas.findIndex(e => e.id === parseInt(id));
                    if (index !== -1) {
                        escalas[index] = response;
                    }
                } else {
                    // Criar nova escala
                    response = await fetchAPI('escalas', 'POST', escalaData);
                    escalas.push(response);
                }
                
                // Fechar modal e atualizar tabela
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalEscala'));
                modal.hide();
                
                atualizarTabelaEscalas();
                
                // Mostrar mensagem de sucesso
                alert(id ? 'Escala atualizada com sucesso!' : 'Escala criada com sucesso!');
            } catch (error) {
                console.error('Erro ao salvar escala:', error);
                alert('Ocorreu um erro ao salvar a escala. Por favor, tente novamente.');
            }
        }
        
        // Função para excluir escala
        async function excluirEscala(id) {
            if (!confirm('Tem certeza que deseja excluir esta escala? Esta ação não pode ser desfeita.')) {
                return;
            }
            
            try {
                await fetchAPI(`escalas/${id}`, 'DELETE');
                
                // Remover da lista local
                escalas = escalas.filter(e => String(e.id) !== String(id));
                
                atualizarTabelaEscalas();
                
                // Mostrar mensagem de sucesso
                alert('Escala excluída com sucesso!');
            } catch (error) {
                console.error('Erro ao excluir escala:', error);
                alert('Ocorreu um erro ao excluir a escala. Por favor, tente novamente.');
            }
        }
    </script>
</body>
</html>
