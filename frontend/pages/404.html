<!DOCTYPE html>

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-church me-2"></i>
                Sistema de Gestão de Igreja
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span class="nome-usuario">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="error-container text-center">
                <div class="error-icon mb-4">
                    <i class="fas fa-church" style="font-size: 5rem; color: var(--bs-primary); animation: pulse 2s infinite;"></i>
                </div>
                <div class="error-code" style="font-size: 8rem; font-weight: bold; color: var(--bs-primary);">404</div>
                <div class="error-message mb-4" style="font-size: 1.5rem;">Página não encontrada</div>
                <p class="mb-4">A página que você está procurando não existe ou foi movida.</p>
                
                <button class="btn btn-primary btn-lg px-4 mb-5" onclick="goToHome()">
                    <i class="fas fa-home me-2"></i> Voltar para o Dashboard
                </button>
                
                <div class="suggestions mt-4">
                    <h4 class="text-primary mb-3">Você pode tentar:</h4>
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <div class="list-group">
                                <a href="dashboard.html" class="list-group-item list-group-item-action">
                                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                                </a>
                                <a href="ministerios.html" class="list-group-item list-group-item-action">
                                    <i class="fas fa-users me-2"></i> Ministérios
                                </a>
                                <a href="escalas.html" class="list-group-item list-group-item-action">
                                    <i class="fas fa-calendar-alt me-2"></i> Escalas
                                </a>
                                <a href="biblia.html" class="list-group-item list-group-item-action">
                                    <i class="fas fa-bible me-2"></i> Bíblia
                                </a>
                                <a href="youtube.html" class="list-group-item list-group-item-action">
                                    <i class="fab fa-youtube me-2"></i> Canal da Igreja
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuração Central -->
    <script src="../js/config.js"></script>
    <!-- App JS -->
    <script src="../js/app.js"></script>
    <!-- Sidebar Loader -->
    <script src="../js/sidebar-loader.js"></script>
    
    <script>
        function goToHome() {
            // Verificar se o usuário está logado
            const usuario = JSON.parse(localStorage.getItem('usuario_logado'));
            
            if (usuario) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Registrar o erro para análise (em um sistema real, enviaria para um servidor)
            const referrer = document.referrer;
            const currentUrl = window.location.href;
            console.log('Erro 404: Redirecionado de', referrer, 'para', currentUrl);
            
            // Verificar se o usuário está logado
            const usuario = verificarLogin();
            
            // Configurar evento de logout
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    fazerLogout();
                });
            }
            
            // Adicionar classe de animação para o ícone
            document.head.insertAdjacentHTML('beforeend', `
                <style>
                    @keyframes pulse {
                        0% { transform: scale(1); }
                        50% { transform: scale(1.1); }
                        100% { transform: scale(1); }
                    }
                </style>
            `);
        });
    </script>
</body>
</html>
