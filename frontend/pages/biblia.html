        // Cache para textos bíblicos
        const cacheBiblia = {};
        
        document.addEventListener('DOMContentLoaded', function() {
            // Aplicar tradução padrão da config
            const versaoPadrao = (window.IGREJA_CONFIG || {}).BIBLIA_TRADUCAO_PADRAO || 'almeida';
            document.getElementById('versao-biblia').value = versaoPadrao;

            // Verificar login
            verificarLogin();
            
            // Configurar sidebar mobile
            const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
            if (sidebarToggleBtn) {
                sidebarToggleBtn.addEventListener('click', function() {
                    document.querySelector('.sidebar').classList.toggle('show');
                });
            }
            
            // Preencher select de livros
            const selectLivro = document.getElementById('livro-biblia');
            
            // Adicionar optgroup para Antigo Testamento
            const optgroupAT = document.createElement('optgroup');
            optgroupAT.label = 'Antigo Testamento';
            
            livrosBiblia.filter(livro => livro.testamento === 'AT').forEach(livro => {
                const option = document.createElement('option');
                option.value = livro.id;
                option.textContent = livro.nome;
                optgroupAT.appendChild(option);
            });
            
            selectLivro.appendChild(optgroupAT);
            
            // Adicionar optgroup para Novo Testamento
            const optgroupNT = document.createElement('optgroup');
            optgroupNT.label = 'Novo Testamento';
            
            livrosBiblia.filter(livro => livro.testamento === 'NT').forEach(livro => {
                const option = document.createElement('option');
                option.value = livro.id;
                option.textContent = livro.nome;
                optgroupNT.appendChild(option);
            });
            
            selectLivro.appendChild(optgroupNT);
            
            // Configurar eventos
            selectLivro.addEventListener('change', atualizarCapitulos);
            document.getElementById('capitulo-biblia').addEventListener('change', carregarTextoBiblico);
            document.getElementById('versao-biblia').addEventListener('change', carregarTextoBiblico);
            document.getElementById('btn-pesquisar-biblia').addEventListener('click', pesquisarBiblia);
            document.getElementById('pesquisar-biblia').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    pesquisarBiblia();
                }
            });
            
            // Inicializar com Gênesis 1 (atualizarCapitulos já chama carregarTextoBiblico)
            selectLivro.value = 'gen';
            atualizarCapitulos();
        });
        
        // Função para atualizar os capítulos disponíveis
        function atualizarCapitulos() {
            const livroId = document.getElementById('livro-biblia').value;
            const selectCapitulo = document.getElementById('capitulo-biblia');
            
            // Limpar select
            selectCapitulo.innerHTML = '';
            
            // Encontrar livro selecionado
            const livro = livrosBiblia.find(l => l.id === livroId);
            
            if (livro) {
                // Adicionar opções de capítulos
                for (let i = 1; i <= livro.capitulos; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = i;
                    selectCapitulo.appendChild(option);
                }
                
                // Carregar texto bíblico
                carregarTextoBiblico();
            }
        }
        
        // Função para carregar o texto bíblico via bible-api.com
        async function carregarTextoBiblico() {
            const versao = document.getElementById('versao-biblia').value;
            const livroId = document.getElementById('livro-biblia').value;
            const capitulo = document.getElementById('capitulo-biblia').value;

            // Mostrar loading
            document.getElementById('biblia-loading').style.display = 'block';
            document.getElementById('biblia-texto').style.display = 'none';
            document.getElementById('biblia-erro').style.display = 'none';
            document.getElementById('biblia-resultados-pesquisa').style.display = 'none';

            try {
                // Verificar cache
                const cacheKey = `${versao}-${livroId}-${capitulo}`;
                let versiculos;

                if (cacheBiblia[cacheKey]) {
                    versiculos = cacheBiblia[cacheKey];
                } else {
                    const livro = livrosBiblia.find(l => l.id === livroId);
                    const url = `https://bible-api.com/${livro.apiName}+${capitulo}?translation=${versao}`;
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const dados = await resp.json();
                    versiculos = dados.verses.map(v => ({ numero: v.verse, texto: v.text.trim() }));
                    cacheBiblia[cacheKey] = versiculos;
                }

                // Encontrar livro
                const livro = livrosBiblia.find(l => l.id === livroId);

                // Atualizar título
                document.getElementById('biblia-titulo-capitulo').textContent = `${livro.nome} ${capitulo}`;

                // Preencher versículos
                const versiculosContainer = document.getElementById('biblia-versiculos');
                versiculosContainer.innerHTML = '';

                versiculos.forEach(v => {
                    const el = document.createElement('p');
                    el.className = 'biblia-verse';
                    el.innerHTML = `<span class="biblia-verse-number">${v.numero}</span> ${v.texto}`;
                    versiculosContainer.appendChild(el);
                });

                // Mostrar texto
                document.getElementById('biblia-loading').style.display = 'none';
                document.getElementById('biblia-texto').style.display = 'block';
            } catch (error) {
                console.error('Erro ao carregar texto bíblico:', error);
                document.getElementById('biblia-loading').style.display = 'none';
                document.getElementById('biblia-erro').style.display = 'block';
                document.getElementById('biblia-erro').textContent = 'Não foi possível carregar o texto bíblico. Verifique sua conexão com a internet e tente novamente.';
            }
        }

        // Função para pesquisar na Bíblia via bible-api.com
        async function pesquisarBiblia() {
            const termo = document.getElementById('pesquisar-biblia').value.trim();
            if (!termo) return;

            const versao = document.getElementById('versao-biblia').value;

            // Mostrar loading
            document.getElementById('biblia-loading').style.display = 'block';
            document.getElementById('biblia-texto').style.display = 'none';
            document.getElementById('biblia-erro').style.display = 'none';
            document.getElementById('biblia-resultados-pesquisa').style.display = 'none';

            try {
                // bible-api.com suporta referência direta (ex: "joão 3:16")
                const termoEncoded = encodeURIComponent(termo);
                const url = `https://bible-api.com/${termoEncoded}?translation=${versao}`;
                const resp = await fetch(url);

                const resultadosContainer = document.getElementById('biblia-lista-resultados');
                resultadosContainer.innerHTML = '';

                if (!resp.ok) {
                    resultadosContainer.innerHTML = `<div class="alert alert-info">Nenhum resultado encontrado para "${termo}". Tente uma referência como "João 3:16" ou "Salmos 23".</div>`;
                } else {
                    const dados = await resp.json();
                    const verses = dados.verses || [];

                    if (verses.length === 0) {
                        resultadosContainer.innerHTML = `<div class="alert alert-info">Nenhum resultado encontrado para "${termo}".</div>`;
                    } else {
                        verses.forEach(v => {
                            const el = document.createElement('div');
                            el.className = 'card mb-3';
                            // Encontrar o livro pelo nome da API
                            const livroEncontrado = livrosBiblia.find(l =>
                                l.apiName.toLowerCase().replace(/\+/g, ' ') === v.book_name.toLowerCase() ||
                                l.nome.toLowerCase() === v.book_name.toLowerCase()
                            );
                            el.innerHTML = `
                                <div class="card-body">
                                    <h5 class="card-title">${v.book_name} ${v.chapter}:${v.verse}</h5>
                                    <p class="card-text">${v.text.trim()}</p>
                                    ${livroEncontrado ? `<button class="btn btn-sm btn-outline-primary btn-ir-versiculo"
                                        data-livro="${livroEncontrado.id}"
                                        data-capitulo="${v.chapter}">Ir para este capítulo</button>` : ''}
                                </div>
                            `;
                            resultadosContainer.appendChild(el);
                        });

                        document.querySelectorAll('.btn-ir-versiculo').forEach(btn => {
                            btn.addEventListener('click', function() {
                                document.getElementById('livro-biblia').value = this.dataset.livro;
                                atualizarCapitulos();
                                document.getElementById('capitulo-biblia').value = this.dataset.capitulo;
                                carregarTextoBiblico();
                            });
                        });
                    }
                }

                document.getElementById('biblia-loading').style.display = 'none';
                document.getElementById('biblia-resultados-pesquisa').style.display = 'block';
            } catch (error) {
                console.error('Erro ao pesquisar na Bíblia:', error);
                document.getElementById('biblia-loading').style.display = 'none';
                document.getElementById('biblia-erro').style.display = 'block';
                document.getElementById('biblia-erro').textContent = 'Não foi possível realizar a pesquisa. Verifique sua conexão e tente novamente.';
            }
        }
    </script>
